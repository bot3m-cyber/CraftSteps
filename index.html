 for(const q of vec){const m=MATERIALS[q.type],f=faces(q);ctx.globalAlpha=q.type==='glass'?.75:1;polygon(f[0],color(m.hex,24),'#00000015',.5);polygon(f[1],color(m.hex,-22),'#00000016',.5);polygon(f[2],color(m.hex,-4),'#00000016',.5);ctx.globalAlpha=1;}
 if(isGuide){for(const q of highlight){const [rx,rz]=rot(q),f=faces({...q,rx,rz});for(const face of f){polygon(face,'rgba(238,39,42,.065)','rgba(226,31,36,.98)',Math.max(1.75,Math.min(3.4,s*.09)));}}}
 // Proprietary-independent render badge: only text, no copied screenshots.
 if(!isGuide){ctx.fillStyle='rgba(255,255,255,.87)';ctx.fillRect(10,h-28,Math.min(w-20,132),19);ctx.fillStyle='#334234';ctx.font='800 10px Arial';ctx.fillText('CRAFTSTEPS · ORIGINAL',16,h-15);}
}
function drawAll(){document.querySelectorAll('canvas[data-build]').forEach(drawCanvas);}
function materialText(){const b=findBuild();return `${b.name}\n${Object.entries(countMaterials(b.blocks)).map(([k,n])=>`${loc(k)}: ${n} (${stacks(k,n)})`).join('\n')}`;}
async function copy(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}else{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.focus();t.select();if(!document.execCommand('copy'))throw Error('copy');t.remove();}return true;}catch{return false;}}
function clicked(event){const el=event.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id,b=findBuild();switch(a){
 case 'home':navigate('home');break;case 'settings':navigate('settings');break;case 'back':navigate(state.view==='guide'||state.view==='materials'?'detail':'home');break;
 case 'toggle-search':state.searchOpen=!state.searchOpen;state.view='home';render(state.searchOpen?'search-input':null);break;
 case 'category':state.category=id;render();break;
 case 'detail':navigate('detail',id);break;
 case 'favorite':{const buildId=id||b.id;state.favorites=state.favorites.includes(buildId)?state.favorites.filter(x=>x!==buildId):[...state.favorites,buildId];put('favorites',state.favorites);render();break;}
 case 'guide':if(!state.progress[b.id]){state.progress[b.id]=1;put('progress',state.progress);}navigate('guide');break;
 case 'materials':navigate('materials');break;
 case 'prev':case 'next':{const n=state.progress[b.id]||1;state.progress[b.id]=Math.max(1,Math.min(b.steps.length,n+(a==='next'?1:-1)));put('progress',state.progress);render();break;}
 case 'mark':{let list=state.collected[b.id]||[];list=list.includes(id)?list.filter(x=>x!==id):[...list,id];state.collected[b.id]=list;put('collected',state.collected);render();break;}
 case 'rotate':state.rotation=(state.rotation+1)%4;render();break;
 case 'zoom-in':state.zoom=Math.min(1.6,state.zoom+.13);render();break;
 case 'zoom-out':state.zoom=Math.max(.65,state.zoom-.13);render();break;
 case 'reset-progress':if(confirm(T().resetQuestion)){delete state.progress[b.id];put('progress',state.progress);navigate('detail');}break;
 case 'reset-all':if(confirm(T().resetQuestion)){state.favorites=[];state.progress={};state.collected={};put('favorites',[]);put('progress',{});put('collected',{});toast(T().resetDone);render();}break;
 case 'copy':void copy(materialText()).then(ok=>toast(ok?T().copied:T().copyFailed));break;
 case 'export':{const blob=new Blob([materialText()],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),link=document.createElement('a');link.href=u;link.download=`craftsteps-${b.id}-materialliste.txt`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);break;}
 case 'share':{const url=window.location.href.split('#')[0]+'#'+b.id;void (navigator.share?navigator.share({title:b.name,url}).catch(()=>copy(url)):copy(url)).then(()=>toast(T().shareCopied)).catch(()=>{});break;}
}}
document.addEventListener('click',clicked);
document.addEventListener('input',event=>{if(event.target.id==='search-input'){state.query=event.target.value;render('search-input');}if(event.target.id==='material-search'){state.materialQuery=event.target.value;render('material-search');}});
document.addEventListener('change',event=>{const id=event.target.id,value=event.target.value;if(id==='difficulty'){state.filter=value;render();}if(id==='theme-select'){state.theme=value;put('theme',value);render();}if(id==='lang-select'){state.lang=value;put('lang',value);render();}if(id==='edition-select'){state.edition=value;put('edition',value);render();}});
document.addEventListener('keydown',event=>{if(state.view==='guide'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&['ArrowRight','ArrowLeft'].includes(event.key)){const b=findBuild(),n=state.progress[b.id]||1;state.progress[b.id]=Math.max(1,Math.min(b.steps.length,n+(event.key==='ArrowRight'?1:-1)));put('progress',state.progress);render();event.preventDefault();}});
window.addEventListener('resize',()=>requestAnimationFrame(drawAll));
if(location.hash&&builds.some(b=>location.hash==='#'+b.id)){state.id=location.hash.slice(1);state.view='detail';}
render();
})();
</script></body></html>
